<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF6F1">
  <title>Sayfa bulunamadı · Parla By Aslı</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/svg+xml" href="/assets/img/logo-pa-bakir.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400..500;1,9..144,400..500&display=swap">
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-link" aria-label="Parla By Aslı anasayfa">
        <img src="/assets/img/logo-yatay-bakir.svg" alt="Parla By Aslı" class="brand-logo">
      </a>
    </div>
  </header>

  <main>
    <section class="thanks-page">
      <div class="container">
        <div class="thanks-card" style="max-width: 480px;">
          <img src="/assets/img/logo-pa-bakir.svg" alt="" style="width: 80px; height: 80px; margin: 0 auto var(--space-md); color: var(--c-bakir); display: block;">

          <span class="eyebrow">404</span>
          <h1 class="h-display" style="font-size: clamp(28px, 5vw, 42px);">Sayfa bulunamadı</h1>

          <p>
            Aradığın sayfayı bulamadık. Ya silindi, ya yer değiştirdi, ya da link bozuk geldi.
          </p>

          <div style="display: flex; flex-direction: column; gap: 8px; margin-top: var(--space-lg);">
            <a href="/" class="btn btn-bakir">ANASAYFAYA DÖN</a>
            <a href="/katalog/kolye/" class="btn btn-ghost">KATALOĞA GÖZ AT</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 Parla By Aslı · Tüm hakları saklıdır</span>
        <span>Türkiye'de tasarlandı</span>
      </div>
    </div>
  </footer>

</body>
</html>
